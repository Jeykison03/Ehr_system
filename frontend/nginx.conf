server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # SPA Routing: Fallback to index.html for all routes
    location / {
        # Try to serve the requested file
        # If it doesn't exist, fallback to index.html
        # This allows React Router to handle all client-side routes
        try_files $uri $uri/ /index.html;
        
        # Cache busting for index.html
        # Don't cache the HTML file itself
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Cache static assets (JS, CSS, images)
    # These have hashes in filenames, so they can be cached indefinitely
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files/directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
