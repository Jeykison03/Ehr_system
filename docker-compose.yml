version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    restart: always
